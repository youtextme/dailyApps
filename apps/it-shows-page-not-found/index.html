<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>It shows page not found</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root { --ink:#1c1917; --accent:#0f766e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: "Source Sans 3", Georgia, serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #99f6e4 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #fed7aa 0%, transparent 50%),
      #fffbeb;
  }
  header { padding: clamp(3rem, 10vw, 6rem) 1.5rem 1rem; }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-size: clamp(2.75rem, 8vw, 5rem);
    line-height: 1.05; margin: 0 0 0.75rem;
  }
  .lead { max-width: 28rem; font-size: 1.125rem; }
  main { padding: 1rem 1.5rem 4rem; max-width: 28rem; }
  label { display: block; margin: 1rem 0 0.35rem; font-weight: 600; }
  input, button {
    width: 100%; font: inherit; padding: 0.85rem 1rem;
    border-radius: 0.35rem; border: 1px solid #d6d3d1;
  }
  button {
    margin-top: 1rem; background: var(--accent); color: #fff;
    border: 0; cursor: pointer; font-weight: 600;
  }
  button:hover { filter: brightness(1.05); }
  #result { margin-top: 1.25rem; min-height: 1.5rem; }
</style>
</head>
<body data-dailyapps-ready="1">
<header>
  <h1>It shows page not found</h1>
  <p class="lead">Built from a Slack objective via local LLMs. Interactive and shareable.</p>
</header>
<main>
  <label for="input">Your input</label>
  <input id="input" type="text" placeholder="Type something" autocomplete="off"/>
  <button id="go" type="button">Run</button>
  <p id="result" aria-live="polite"></p>
</main>
<script>
  document.getElementById("go").addEventListener("click", () => {
    const v = document.getElementById("input").value.trim() || "ready";
    document.getElementById("result").textContent = "Result: " + v;
  });
</script>
</body>
</html>
