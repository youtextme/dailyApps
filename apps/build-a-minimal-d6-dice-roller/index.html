<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>D6 Dice Roller</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root { --ink:#1c1917; --accent:#0f766e; --face:#fffbeb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: "Source Sans 3", Georgia, serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #99f6e4 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #fed7aa 0%, transparent 50%),
      #fffbeb;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.25rem;
  }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    margin: 0 0 0.5rem; text-align: center;
  }
  .die {
    width: 7rem; height: 7rem; margin: 1.5rem 0;
    background: var(--face); border: 3px solid var(--ink);
    border-radius: 1rem; display: grid; place-items: center;
    font-family: Fraunces, Georgia, serif;
    font-size: 3.5rem; font-weight: 600;
    box-shadow: 4px 4px 0 var(--ink);
  }
  button {
    font: inherit; font-weight: 600; padding: 0.9rem 2rem;
    background: var(--accent); color: #fff; border: 0;
    border-radius: 0.35rem; cursor: pointer; font-size: 1.1rem;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  #result { margin-top: 1rem; font-size: 1.125rem; min-height: 1.5rem; }
</style>
</head>
<body data-dailyapps-ready="1">
  <h1>D6 Dice Roller</h1>
  <p>Roll a fair six-sided die — works fully offline.</p>
  <div class="die" id="face" aria-label="die face">?</div>
  <button id="roll" type="button">Roll d6</button>
  <p id="result" aria-live="polite"></p>
<script>
  document.getElementById("roll").addEventListener("click", () => {
    const n = Math.floor(Math.random() * 6) + 1;
    document.getElementById("face").textContent = String(n);
    document.getElementById("result").textContent = "You rolled: " + n;
  });
</script>
</body>
</html>
