[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tireless"
version = "0.1.0"
description = "dailyApps Slack → stateful objective loops → local LLM shipping engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.20", "slack-sdk>=3.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
tireless = "tireless.__main__:main"

[tool.setuptools.packages.find]
include = ["tireless*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
